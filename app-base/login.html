<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Asilo Cabeza de Algodón</title>
<link rel="stylesheet" href="/comun.css">
<style>
  /* El ingreso usa la misma paleta y letra que las demas pantallas
     (comun.css); aqui solo va lo que es propio de esta tarjeta. */
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }

  .tarjeta{
    width:100%; max-width:420px; background:var(--superficie);
    border:1px solid var(--borde); border-radius:var(--radio); overflow:hidden;
  }

  /* Nombre del asilo con su marca al lado. Va sobre fondo claro y no
     sobre una franja de color: la flor de algodon se dibuja con trazo
     violeta y necesita fondo blanco para leerse. */
  .encabezado{
    display:grid; grid-template-columns:48px 1fr; column-gap:14px; align-items:center;
    padding:24px 24px 18px; border-bottom:1px solid var(--borde);
  }
  .encabezado .marca{grid-row:span 2; width:48px; height:48px; color:var(--violeta-profundo);}
  .encabezado h1{font-size:22px; line-height:1.25; color:var(--violeta-profundo);}
  .encabezado p{grid-column:2; margin:6px 0 0; font-size:14.5px; color:var(--texto-suave);}

  form{padding:24px;}
  .campo{margin-bottom:16px;}
  button{width:100%; padding:11px; font-size:16px;}

  /* comun.css oculta todo .aviso que no sea .ok o .error; aqui el aviso
     se muestra y se oculta con .oculto, asi que se devuelve a block. */
  .aviso{display:block; margin-top:16px; border-left-color:var(--error); background:var(--error-fondo);}
  .aviso.oculto{display:none;}

  /* El bloqueo se ve distinto de una contrasena equivocada: una se
     arregla escribiendo bien, la otra solo esperando. Si se vieran
     iguales, la persona seguiria intentando y alargaria su bloqueo.
     Por eso va en ambar (aviso, espere) y no en rojo (error). */
  .aviso.bloqueo{border-left-color:var(--advertencia); background:var(--advertencia-fondo);}
  .aviso.bloqueo strong{display:block; margin-bottom:3px; color:var(--advertencia-texto);}

  .ayuda{
    margin:0; padding:16px 24px 22px; border-top:1px solid var(--borde);
    background:var(--fondo); font-size:14px; color:var(--texto-suave);
  }
  .ayuda strong{color:var(--texto); display:block; margin-bottom:8px; font-size:14.5px;}
  .ayuda table{font-size:14px;}
  .ayuda td{padding:3px 0; border:none; background:transparent;}
  .ayuda td:first-child{font-family:var(--letra-codigo); color:var(--violeta-profundo); font-weight:600; width:40%;}
  .ayuda .clave{margin-top:10px;}
  .ayuda .clave strong{font-family:var(--letra-codigo);}
</style>
</head>
<body>

<div class="tarjeta">
  <div class="encabezado">
    <!-- Marca del asilo: una flor de algodon reducida a figuras simples.
         Cinco capullos redondos alrededor de un centro, y debajo el
         caliz de tres puntas. Va en linea para no depender de archivos. -->
    <svg class="marca" viewBox="0 0 48 48" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="24" cy="8.5" r="5.5"/>
      <circle cx="34" cy="15.8" r="5.5"/>
      <circle cx="30.2" cy="27.5" r="5.5"/>
      <circle cx="17.8" cy="27.5" r="5.5"/>
      <circle cx="14" cy="15.8" r="5.5"/>
      <circle cx="24" cy="19" r="3.5"/>
      <path d="M15 37 L20.5 34 L24 39 L27.5 34 L33 37"/>
      <path d="M24 39 V46"/>
    </svg>
    <h1>Asilo de Ancianos<br>«Cabeza de Algodón»</h1>
    <p>Sistema de administración · Ingreso al sistema</p>
  </div>

  <form id="formulario" autocomplete="on">
    <div class="campo">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" autofocus>
    </div>
    <div class="campo">
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" name="contrasena" type="password" autocomplete="current-password">
    </div>
    <button type="submit" id="boton">Ingresar</button>
    <div class="aviso oculto" id="aviso"></div>
  </form>

  <div class="ayuda">
    <strong>Usuarios de demostración</strong>
    <table>
      <tr><td>admin</td><td>Administrador</td></tr>
      <tr><td>secretaria</td><td>Secretaria del asilo</td></tr>
      <tr><td>medico</td><td>Médico general</td></tr>
      <tr><td>fundacion</td><td>Fundación</td></tr>
      <tr><td>caja</td><td>Caja y cobros</td></tr>
    </table>
    <div class="clave">Contraseña de todos: <strong style="display:inline">asilo2026</strong></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function mostrarError(texto){
  const aviso = $("aviso");
  aviso.classList.remove("bloqueo");
  aviso.textContent = texto;
  aviso.classList.remove("oculto");
}

/* El ingreso quedo cerrado por intentos fallidos. No es un error de
   quien escribe: es una espera. Se muestra en ocre y con titulo propio
   para que se note que insistir no va a servir de nada. */
function mostrarBloqueo(texto){
  const aviso = $("aviso");
  aviso.classList.add("bloqueo");
  aviso.innerHTML = "<strong>Ingreso bloqueado temporalmente</strong>";
  aviso.appendChild(document.createTextNode(texto));
  aviso.classList.remove("oculto");
}

function limpiar(){
  $("aviso").classList.add("oculto");
  $("aviso").classList.remove("bloqueo");
  $("usuario").classList.remove("malo");
  $("contrasena").classList.remove("malo");
}

// El navegador ya trae la cookie de sesion si el usuario entro antes.
// Si sigue siendo valida, no tiene sentido pedirle que escriba de nuevo.
(async function saltarSiYaEntro(){
  try{
    const r = await fetch("/api/yo");
    if(r.ok) location.replace("/panel");
  }catch{ /* sin conexion: que use el formulario */ }
})();

$("formulario").addEventListener("submit", async (evento) => {
  evento.preventDefault();
  limpiar();

  const usuario = $("usuario").value.trim();
  const contrasena = $("contrasena").value;

  // Revision en el navegador antes de enviar: si falta algo, el error
  // sale de inmediato y no se gasta una peticion.
  if(!usuario){ $("usuario").classList.add("malo"); return mostrarError("Escriba su usuario."); }
  if(!contrasena){ $("contrasena").classList.add("malo"); return mostrarError("Escriba su contraseña."); }

  $("boton").disabled = true;
  $("boton").textContent = "Verificando...";

  try{
    const respuesta = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario, contrasena })
    });
    const datos = await respuesta.json();

    const detalle = typeof datos.detail === "string" ? datos.detail : "No se pudo ingresar.";

    // 429 = bloqueado por intentos fallidos. No se marcan las casillas
    // en rojo: lo que escribio puede estar perfecto, simplemente ya no
    // se le esta permitiendo intentar todavia.
    if(respuesta.status === 429){
      $("contrasena").value = "";
      mostrarBloqueo(detalle);
      return;
    }

    if(!respuesta.ok){
      // El servidor responde lo mismo si el usuario no existe o si la
      // contrasena esta mal, para no confirmar cuales usuarios son validos.
      $("usuario").classList.add("malo");
      $("contrasena").classList.add("malo");
      $("contrasena").value = "";
      mostrarError(detalle);
      return;
    }

    location.replace("/panel");
  }catch{
    mostrarError("No se pudo contactar al servidor. Verifique que el sistema esté encendido.");
  }finally{
    $("boton").disabled = false;
    $("boton").textContent = "Ingresar";
  }
});
</script>

</body>
</html>
