<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Ancianos · Asilo Cabeza de Algodón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#E7EBE6; --superficie:#FBFCFA; --tinta:#17231F; --tinta-suave:#5A6A64;
    --pino:#1E5245; --pino-claro:#DCE7E2; --ocre:#B07A19; --granate:#8C2230;
    --linea:#C8D2CC; --radio:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--fondo);color:var(--tinta);
       font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;}
  h1,h2{font-family:"Bitter",Georgia,serif;margin:0;}
  header{background:var(--pino);color:#EDF3F0;padding:18px 24px;border-bottom:3px solid #14382F;}
  header h1{font-size:20px;}
  header p{margin:4px 0 0;font-size:13px;color:#B6CCC4;}
  .chip{display:inline-flex;align-items:center;gap:8px;background:#14382F;border:1px solid #2C6A5A;
        border-radius:999px;padding:5px 12px;font-size:12.5px;font-family:"IBM Plex Mono",monospace;margin-top:12px;}
  .punto{width:8px;height:8px;border-radius:50%;background:#7C8C86;}
  .punto.arriba{background:#5BC08C;}
  .punto.abajo{background:#E0616F;}

  main{max-width:1180px;margin:0 auto;padding:22px 24px 60px;}
  section{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);
          padding:18px;margin-bottom:20px;}
  section > h2{font-size:16px;padding-bottom:10px;border-bottom:1px solid var(--linea);margin-bottom:14px;}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--tinta-suave);margin-bottom:4px;margin-top:12px;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:6px;
        background:#fff;color:var(--tinta);font-size:14px;font-family:"IBM Plex Sans",sans-serif;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--pino);outline-offset:1px;}
  textarea{resize:vertical;min-height:60px;}
  .check{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .check input{width:auto;}
  .check label{margin:0;font-weight:500;color:var(--tinta);}

  button{border:none;border-radius:6px;padding:9px 16px;font-size:13.5px;font-weight:600;
         background:var(--pino);color:#fff;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;margin-top:16px;}
  button:hover{background:#16443A;}
  button.mini{padding:5px 10px;font-size:12px;margin:0;}
  button.peligro{background:transparent;color:var(--granate);border:1px solid var(--granate);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--tinta-suave);
     border-bottom:1px solid var(--linea);padding:8px;font-weight:600;white-space:nowrap;}
  td{padding:8px;border-bottom:1px solid #E6EBE7;white-space:nowrap;}
  .tabla-scroll{overflow-x:auto;}
  .mono{font-family:"IBM Plex Mono",monospace;}
  .aviso{padding:10px 12px;border-radius:6px;font-size:13.5px;margin-top:14px;display:none;}
  .aviso.ok{background:#DDEBE4;color:#14382F;border-left:3px solid var(--pino);display:block;}
  .aviso.error{background:#F6E7E9;color:#6E1B26;border-left:3px solid var(--granate);display:block;}
  .vacio{color:var(--tinta-suave);font-size:13.5px;font-style:italic;padding:10px 0;}
</style>
</head>
<body>

<header>
  <h1>Registro de Ancianos</h1>
  <p>Asilo de Ancianos «Cabeza de Algodón» · módulo de ingreso de internos</p>
  <div class="chip"><span class="punto" id="punto"></span> ms-pacientes <span id="detalle"></span></div>
</header>

<main>

  <section>
    <h2>Ficha de ingreso</h2>

    <label for="nombres">Nombres</label>
    <input id="nombres">

    <label for="apellidos">Apellidos</label>
    <input id="apellidos">

    <label for="dpi">DPI</label>
    <input id="dpi">

    <label for="fecha_nacimiento">Fecha de nacimiento</label>
    <input id="fecha_nacimiento" placeholder="AAAA-MM-DD">

    <label for="sexo">Sexo</label>
    <select id="sexo">
      <option value="">Seleccione</option>
      <option value="M">M</option>
      <option value="F">F</option>
    </select>

    <label for="tipo_sangre">Tipo de sangre</label>
    <input id="tipo_sangre">

    <label for="fecha_ingreso">Fecha de ingreso</label>
    <input id="fecha_ingreso" placeholder="AAAA-MM-DD">

    <label for="habitacion">Habitación</label>
    <input id="habitacion">

    <label for="procedencia">Procedencia</label>
    <input id="procedencia">

    <label for="familiar_nombre">Nombre del familiar responsable</label>
    <input id="familiar_nombre">

    <label for="familiar_parentesco">Parentesco</label>
    <input id="familiar_parentesco">

    <label for="familiar_telefono">Teléfono del familiar</label>
    <input id="familiar_telefono">

    <label for="familiar_email">Correo del familiar</label>
    <input id="familiar_email">

    <label for="padecimientos">Padecimientos</label>
    <textarea id="padecimientos"></textarea>

    <label for="alergias">Alergias</label>
    <input id="alergias">

    <div class="check">
      <input type="checkbox" id="cubierto_fundacion" checked>
      <label for="cubierto_fundacion">Cubierto por la fundación</label>
    </div>

    <button onclick="guardar()">Guardar</button>

    <div class="aviso" id="aviso"></div>
  </section>

  <section>
    <h2>Ancianos registrados</h2>
    <div class="tabla-scroll" id="lista"><p class="vacio">Cargando…</p></div>
  </section>

</main>

<script>
const MS_PACIENTES = "http://localhost:8083";

const campos = ["nombres","apellidos","dpi","fecha_nacimiento","sexo","tipo_sangre",
  "fecha_ingreso","habitacion","procedencia","familiar_nombre","familiar_parentesco",
  "familiar_telefono","familiar_email","padecimientos","alergias"];

function avisar(texto, ok) {
  const caja = document.getElementById("aviso");
  caja.className = "aviso " + (ok ? "ok" : "error");
  caja.textContent = texto;
}

async function revisar() {
  try {
    const r = await fetch(MS_PACIENTES + "/health");
    const d = await r.json();
    document.getElementById("punto").className = "punto arriba";
    document.getElementById("detalle").textContent = "· " + d.ancianos_activos + " activos";
  } catch {
    document.getElementById("punto").className = "punto abajo";
    document.getElementById("detalle").textContent = "· sin conexión";
  }
}

async function guardar() {
  const cuerpo = { cubierto_fundacion: document.getElementById("cubierto_fundacion").checked };
  campos.forEach(c => {
    const v = document.getElementById(c).value.trim();
    cuerpo[c] = v === "" ? null : v;
  });

  try {
    const r = await fetch(MS_PACIENTES + "/pacientes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo)
    });
    const d = await r.json();
    if (!r.ok) {
      avisar(JSON.stringify(d.detail), false);
      return;
    }
    avisar("Guardado con el código " + d.codigo, true);
    campos.forEach(c => document.getElementById(c).value = "");
    listar();
    revisar();
  } catch (e) {
    avisar("Error: " + e.message, false);
  }
}

async function listar() {
  const contenedor = document.getElementById("lista");
  try {
    const r = await fetch(MS_PACIENTES + "/pacientes");
    const datos = await r.json();
    if (!datos.length) {
      contenedor.innerHTML = '<p class="vacio">Sin registros.</p>';
      return;
    }
    contenedor.innerHTML = `
      <table>
        <thead><tr>
          <th>Código</th><th>Nombres</th><th>Apellidos</th><th>DPI</th><th>Nacimiento</th>
          <th>Edad</th><th>Sexo</th><th>Sangre</th><th>Ingreso</th><th>Habitación</th>
          <th>Procedencia</th><th>Familiar</th><th>Parentesco</th><th>Teléfono</th>
          <th>Correo</th><th>Padecimientos</th><th>Alergias</th><th>Fundación</th>
          <th>Estado</th><th></th>
        </tr></thead>
        <tbody>${datos.map(p => `
          <tr>
            <td class="mono">${p.codigo}</td>
            <td>${p.nombres}</td>
            <td>${p.apellidos}</td>
            <td class="mono">${p.dpi || ""}</td>
            <td class="mono">${p.fecha_nacimiento}</td>
            <td class="mono">${p.edad}</td>
            <td>${p.sexo}</td>
            <td>${p.tipo_sangre || ""}</td>
            <td class="mono">${p.fecha_ingreso}</td>
            <td>${p.habitacion || ""}</td>
            <td>${p.procedencia || ""}</td>
            <td>${p.familiar_nombre}</td>
            <td>${p.familiar_parentesco || ""}</td>
            <td class="mono">${p.familiar_telefono}</td>
            <td>${p.familiar_email || ""}</td>
            <td>${p.padecimientos || ""}</td>
            <td>${p.alergias || ""}</td>
            <td>${p.cubierto_fundacion ? "Sí" : "No"}</td>
            <td>${p.estado}</td>
            <td><button class="mini peligro" onclick="eliminar('${p.codigo}')">Eliminar</button></td>
          </tr>`).join("")}
        </tbody>
      </table>`;
  } catch (e) {
    contenedor.innerHTML = '<p class="vacio">No se pudo cargar el listado.</p>';
  }
}

async function eliminar(codigo) {
  await fetch(MS_PACIENTES + "/pacientes/" + codigo, { method: "DELETE" });
  listar();
  revisar();
}

revisar();
listar();
</script>
</body>
</html>
