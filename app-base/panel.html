<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Asilo Cabeza de Algodón</title>
<link rel="stylesheet" href="/comun.css">
<style>
  /* Propio del panel: las tarjetas de los modulos. */
  section + section{margin-top:32px;}
  section > h2{font-size:20px;margin-bottom:12px;color:var(--texto);}
  .rejilla-modulos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}

  .modulo{
    background:var(--superficie); border:1px solid var(--borde);
    border-radius:var(--radio); padding:18px; text-decoration:none;
    color:var(--texto); display:block; transition:border-color .15s;
  }
  .modulo:hover{border-color:var(--violeta-medio);}
  .modulo:focus-visible{outline:2px solid var(--violeta-medio);outline-offset:2px;}
  .modulo h3{font-size:18px;margin-bottom:6px;color:var(--violeta-profundo);}
  .modulo p{margin:0;font-size:15px;color:var(--texto-suave);line-height:1.45;}
  .modulo .cifra{
    font-family:var(--letra-titulos); font-size:30px; font-variant-numeric:tabular-nums;
    color:var(--violeta-profundo); margin:10px 0 0; line-height:1.1;
  }
  .modulo .pie{font-size:14px;color:var(--texto-suave);margin-top:2px;}

  /* Lo que falta por construir se distingue con borde punteado y fondo
     calido, no bajando la opacidad: a media opacidad el texto queda por
     debajo del contraste minimo y no se puede leer. */
  .modulo.apagado{pointer-events:none;background:var(--fondo);border-style:dashed;}
  .modulo.apagado h3{color:var(--texto-suave);}
  .etiqueta-pendiente{
    display:inline-block; margin-bottom:8px; padding:3px 8px; border-radius:4px;
    background:var(--advertencia-fondo); color:var(--advertencia-texto);
    font-family:var(--letra-texto); font-size:12.5px; font-weight:600;
  }
  .cargando{color:var(--texto-suave);font-size:15px;}
</style>
</head>
<body>

<header></header>

<main>
  <section>
    <h2>Lo que le corresponde hacer</h2>
    <div class="rejilla-modulos" id="modulos"><span class="cargando">Cargando…</span></div>
  </section>

  <section>
    <h2>Todavía por construir</h2>
    <div class="rejilla-modulos" id="futuros"></div>
  </section>
</main>

<script src="/comun.js"></script>
<script>
/* ---------------------------------------------------------------------
   Catalogo de modulos.

   «recurso» es el mismo nombre con el que el sistema decide quien puede
   ver que: si el puesto de la persona no alcanza para consultarlo, la
   tarjeta ni se dibuja. El menu no esta escrito a mano rol por rol.

   «gestiona» marca las pantallas de mantenimiento: esas se muestran a
   quien puede modificar el recurso, no a todo el que puede leerlo. El
   catalogo lo leen todos para llenar sus listas, pero lo mantiene la
   fundacion.

   «tambien» es un segundo recurso que hace falta: la asignacion trabaja
   con las visitas y con las remisiones, y el especialista ve las visitas
   pero no las remisiones.

   «alguno» sirve para una pantalla con varias secciones: aparece si la
   persona puede ver al menos una.

   «rol» marca las pantallas que no salen de un recurso del sistema sino
   de un puesto: la de usuarios es solo del administrador.

   «consulta» es el texto para quien entra solo a mirar: la secretaria
   ve las remisiones, pero remitir es del medico general.

   «cifra» saca su numero de los datos del modulo mismo. Si la consulta
   no se puede hacer -porque a ese puesto no le toca- la tarjeta sale
   sin número y nada más: no es un error que la persona deba ver.
   --------------------------------------------------------------------- */

const MODULOS = [
  {
    recurso: "pacientes",
    titulo:  "Registro de internos",
    texto:   "Fichas de los ancianos, su familiar responsable y sus padecimientos.",
    consulta: { recurso: "pacientes", metodo: "POST", texto: "Consultar las fichas de los ancianos y su familiar responsable." },
    enlace:  "/pacientes.html",
    cifra:   async () => {
      const fichas = await apiSilenciosa("/api/pacientes");
      return fichas && { valor: fichas.length, pie: fichas.length === 1 ? "interno registrado" : "internos registrados" };
    }
  },
  {
    recurso: "solicitudes",
    titulo:  "Remisiones médicas",
    texto:   "Remitir a un interno con un especialista y ver las remisiones hechas.",
    consulta: { recurso: "solicitudes", metodo: "POST", texto: "Ver las remisiones hechas y si ya tienen visita." },
    enlace:  "/solicitudes.html",
    cifra:   async () => {
      const solicitudes = await apiSilenciosa("/api/solicitudes");
      if(!solicitudes) return null;
      const enEspera = solicitudes.filter(s => s.estado === "PENDIENTE").length;
      return { valor: enEspera, pie: enEspera === 1 ? "espera una cita" : "esperan una cita" };
    }
  },
  {
    recurso: "visitas",
    tambien: "solicitudes",
    titulo:  "Asignación de visitas",
    texto:   "Asignar médico y fecha a los internos que esperan una cita.",
    consulta: { recurso: "solicitudes", metodo: "POST", texto: "Ver qué internos esperan cita y las visitas programadas." },
    enlace:  "/asignaciones.html",
    cifra:   async () => {
      const visitas = await apiSilenciosa("/api/visitas");
      return visitas && { valor: visitas.length, pie: visitas.length === 1 ? "visita programada" : "visitas programadas" };
    }
  },
  {
    recurso: "tarifas",
    titulo:  "Tarifario",
    texto:   "Precios de consultas, exámenes y medicamentos, con lo que cubre la fundación.",
    consulta: { recurso: "tarifas", metodo: "PUT", texto: "Consultar los precios de consultas, exámenes y medicamentos." },
    enlace:  "/tarifario.html",
    cifra:   async () => {
      const tarifas = await apiSilenciosa("/api/tarifas");
      if(!tarifas) return null;
      const enUso = tarifas.filter(t => t.activo).length;
      return { valor: enUso, pie: enUso === 1 ? "concepto en uso" : "conceptos en uso" };
    }
  },
  {
    recurso: "estado-cuenta",
    titulo:  "Cuentas de internos",
    texto:   "Lo que debe cada familiar responsable, sus cobros y los pagos recibidos.",
    consulta: { recurso: "cargos", metodo: "POST", texto: "Consultar lo que debe cada familiar responsable y los pagos recibidos." },
    enlace:  "/cuentas.html",
    cifra:   async () => {
      const cargos = await apiSilenciosa("/api/cargos");
      if(!cargos) return null;
      const porCobrar = cargos.filter(c => c.estado === "PENDIENTE").length;
      return { valor: porCobrar, pie: porCobrar === 1 ? "cobro por cobrar" : "cobros por cobrar" };
    }
  },
  {
    recurso: "catalogo",
    gestiona: true,
    titulo:  "Catálogo médico",
    texto:   "Médicos, especialidades, enfermeros, exámenes y medicamentos de la fundación.",
    enlace:  "/catalogo.html",
    cifra:   async () => {
      const medicos = await apiSilenciosa("/api/catalogo/medicos?solo_activos=true");
      return medicos && { valor: medicos.length, pie: medicos.length === 1 ? "médico en el cuadro" : "médicos en el cuadro" };
    }
  },
  {
    recurso: "fichas",
    gestiona: true,
    titulo:  "Atención de visitas",
    texto:   "Diagnóstico de la visita, exámenes que se ordenan y medicamentos que se recetan.",
    enlace:  "/atencion.html",
    cifra:   async () => {
      const [visitas, fichas] = await Promise.all([apiSilenciosa("/api/visitas"), apiSilenciosa("/api/fichas")]);
      if(!visitas || !fichas) return null;
      const conFicha = new Set(fichas.map(f => f.visita_id));
      const faltan = visitas.filter(v => !conFicha.has(v.id)).length;
      return { valor: faltan, pie: faltan === 1 ? "visita por atender" : "visitas por atender" };
    }
  },
  {
    recurso: "resultados",
    gestiona: true,
    titulo:  "Laboratorio",
    texto:   "Exámenes ordenados por el especialista y registro de sus resultados.",
    enlace:  "/laboratorio.html",
    cifra:   async () => {
      const ordenes = await apiSilenciosa("/api/examenes?estado=PENDIENTE");
      return ordenes && { valor: ordenes.length, pie: ordenes.length === 1 ? "examen por hacer" : "exámenes por hacer" };
    }
  },
  {
    recurso: "despachos",
    gestiona: true,
    titulo:  "Farmacia",
    texto:   "Medicamentos recetados y registro de lo que se entrega.",
    enlace:  "/farmacia.html",
    cifra:   async () => {
      const recetas = await apiSilenciosa("/api/recetas?estado=PENDIENTE");
      return recetas && { valor: recetas.length, pie: recetas.length === 1 ? "receta por despachar" : "recetas por despachar" };
    }
  },
  {
    recurso: "fichas",
    titulo:  "Historial médico",
    texto:   "Todas las visitas de un interno con su diagnóstico, exámenes y medicamentos.",
    enlace:  "/historial.html",
    cifra:   async () => {
      const fichas = await apiSilenciosa("/api/fichas");
      return fichas && { valor: fichas.length, pie: fichas.length === 1 ? "ficha médica" : "fichas médicas" };
    }
  },
  {
    alguno:  ["cuotas", "donaciones", "gastos", "fundacion"],
    titulo:  "Entradas, salidas y fundación",
    texto:   "Cuotas de los familiares, donaciones, gastos del asilo y la cuenta con la fundación.",
    enlace:  "/finanzas.html",
    cifra:   async () => {
      const d = await apiSilenciosa("/api/fundacion/deuda");
      if(d) return { valor: q(d.saldo), pie: "se le debe a la fundación" };
      const cuotas = await apiSilenciosa("/api/cuotas?estado=PENDIENTE");
      return cuotas && { valor: cuotas.length, pie: cuotas.length === 1 ? "cuota por cobrar" : "cuotas por cobrar" };
    }
  },
  {
    recurso: "reportes",
    titulo:  "Reportes",
    texto:   "Los siete informes del asilo: costos, atención médica, cobros, ingresos y pagos a la fundación.",
    enlace:  "/reportes.html",
    cifra:   async () => {
      const informes = await apiSilenciosa("/api/reportes");
      return informes && { valor: informes.length, pie: "informes disponibles" };
    }
  },
  {
    rol:     "ADMIN",
    titulo:  "Usuarios del sistema",
    texto:   "Cuentas del personal: altas, contraseñas olvidadas, cambios de puesto y bajas.",
    enlace:  "/usuarios.html",
    cifra:   async () => {
      const usuarios = await apiSilenciosa("/api/usuarios");
      if(!usuarios) return null;
      const activos = usuarios.filter(u => u.activo).length;
      return { valor: activos, pie: activos === 1 ? "cuenta activa" : "cuentas activas" };
    }
  }
];

// Lo que todavia no existe se muestra apagado, para que se vea el alcance
// completo. Hoy no queda nada pendiente y la seccion no se dibuja.
const FUTUROS = [];

function dibujarModulo(m, cifra){
  const numero = cifra
    ? `<div class="cifra">${cifra.valor}</div><div class="pie">${cifra.pie}</div>`
    : "";
  return `
    <a class="modulo" href="${m.enlace}">
      <h3>${m.titulo}</h3>
      <p>${m.texto}</p>
      ${numero}
    </a>`;
}

(async function arrancar(){
  const yo = await iniciarPantalla({ subtitulo: "Sistema de administración" });
  if(!yo) return;

  const visibles = MODULOS.filter(m => (m.rol
    ? yo.rol === m.rol
    : m.alguno
      ? m.alguno.some(r => yo.recursos.includes(r))
    : m.gestiona
      ? (yo.gestiona || []).includes(m.recurso)
      : yo.recursos.includes(m.recurso))
    && (!m.tambien || yo.recursos.includes(m.tambien)));

  visibles.forEach(m => {
    if(m.consulta && !permite(yo, m.consulta.recurso, m.consulta.metodo)) m.texto = m.consulta.texto;
  });

  // Se dibujan primero sin numero, para que el menu aparezca de una vez,
  // y las cifras se van poniendo conforme llegan.
  porId("modulos").innerHTML = visibles.length
    ? visibles.map(m => dibujarModulo(m, null)).join("")
    : '<p class="cargando">Su puesto en el asilo todavía no tiene módulos asignados. Avise al encargado del sistema.</p>';

  porId("futuros").closest("section").hidden = !FUTUROS.length;
  porId("futuros").innerHTML = FUTUROS.map(f => `
    <div class="modulo apagado">
      <span class="etiqueta-pendiente">POR CONSTRUIR</span>
      <h3>${f.titulo}</h3>
      <p>${f.texto}</p>
    </div>`).join("");

  const cifras = await Promise.all(visibles.map(m => m.cifra()));
  porId("modulos").innerHTML = visibles.map((m, i) => dibujarModulo(m, cifras[i])).join("");
})();
</script>

</body>
</html>
