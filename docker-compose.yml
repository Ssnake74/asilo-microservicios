# Orquestacion de los microservicios del proyecto
# Sistema para Administracion Asilo de Ancianos "Cabeza de Algodon"
# Levantar todo con:  docker compose up --build

services:

  ms-cobros:
    build: ./ms-cobros
    container_name: asilo-ms-cobros
    ports:
      - "8082:8082"
    environment:
      - DB_PATH=/data/cobros.db
    volumes:
      - cobros-datos:/data
    restart: unless-stopped

  ms-solicitudes:
    build: ./ms-solicitudes
    container_name: asilo-ms-solicitudes
    ports:
      - "8081:8081"
    environment:
      - DB_PATH=/data/solicitudes.db
      # Dentro de la red de Docker los servicios se llaman por su nombre
      - MS_COBROS_URL=http://ms-cobros:8082
    volumes:
      - solicitudes-datos:/data
    depends_on:
      - ms-cobros
    restart: unless-stopped

  app-base:
    build: ./app-base
    container_name: asilo-app-base
    ports:
      - "8090:80"
    depends_on:
      - ms-solicitudes
      - ms-cobros
    restart: unless-stopped

volumes:
  cobros-datos:
  solicitudes-datos:
