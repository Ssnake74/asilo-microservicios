# =====================================================================
# Sistema para Administracion Asilo de Ancianos "Cabeza de Algodon"
# Universidad Mariano Galvez de Guatemala - Centro Regional de Mazatenango
#
# Los microservicios no llevan "ports" (RNF-03): solo el gateway los
# alcanza, por la red interna, y nadie se salta la sesion ni el rol.
#
# Apagar: docker compose down. No usar "down -v": borra los datos.
# =====================================================================

services:

  # -------------------------------------------------------------------
  # MySQL 8. Sale por el 3307 del equipo y no por el 3306 para no chocar
  # con un MySQL ya instalado (XAMPP, Laragon). Dentro de la red de
  # Docker se sigue usando el 3306.
  # -------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: asilo-mysql
    command: --default-time-zone=-06:00
    environment:
      MYSQL_ROOT_PASSWORD: root_asilo_2026
      TZ: America/Guatemala
    ports:
      - "3307:3306"
    volumes:
      # Datos persistentes: sobreviven a un "docker compose down"
      - mysql-datos:/var/lib/mysql
      # Los .sql de esta carpeta se ejecutan solo la primera vez
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Los servicios esperan a que MySQL acepte conexiones, no solo a
      # que el contenedor arranque.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_asilo_2026"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Mailpit: servidor SMTP de prueba para el aviso al familiar (RF-44).
  # Recibe los correos y los muestra en una bandeja web, sin mandarlos
  # a internet.
  #
  #   1025 -> SMTP (al que le escriben los servicios)
  #   8025 -> bandeja web (http://localhost:8025)
  # -------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: asilo-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Adminer, para ver las tablas durante el desarrollo.
  #
  #   http://localhost:8091
  #   Motor: MySQL / Servidor: mysql / Usuario: root / Clave: root_asilo_2026
  # -------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: asilo-adminer
    ports:
      - "8091:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    restart: unless-stopped

  # ===================================================================
  # Microservicios de negocio: cada uno con su esquema y su usuario de
  # MySQL, y sin "ports" (RNF-03).
  # ===================================================================

  # -------------------------------------------------------------------
  # Cobros: tarifario, cargos y estado de cuenta (esquema asilo_cobros).
  # -------------------------------------------------------------------
  ms-cobros:
    build: ./ms-cobros
    container_name: asilo-ms-cobros
    # Sin "ports" a proposito (RNF-03).
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=u_cobros
      - DB_PASSWORD=cobros_2026
      - DB_NAME=asilo_cobros
      - TZ=America/Guatemala
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Catalogo medico: especialidades, medicos, enfermeros, examenes y
  # medicamentos (esquema asilo_catalogo). Le pregunta a cobros el precio
  # de los examenes y medicamentos sembrados.
  # -------------------------------------------------------------------
  ms-catalogo:
    build: ./ms-catalogo
    container_name: asilo-ms-catalogo
    # Sin "ports" a proposito (RNF-03).
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=u_catalogo
      - DB_PASSWORD=catalogo_2026
      - DB_NAME=asilo_catalogo
      - MS_COBROS_URL=http://ms-cobros:8082
      - TZ=America/Guatemala
    depends_on:
      mysql:
        condition: service_healthy
      ms-cobros:
        condition: service_started
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Atencion medica: ficha de la visita, examenes y resultados, recetas y
  # despachos (esquema asilo_clinico). Lee la visita en ms-solicitudes y
  # el examen o medicamento en ms-catalogo; el cargo lo pide a ms-cobros,
  # y si cobros no responde lo registrado se guarda igual (RNF-12).
  # -------------------------------------------------------------------
  ms-clinico:
    build: ./ms-clinico
    container_name: asilo-ms-clinico
    # Sin "ports" a proposito (RNF-03).
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=u_clinico
      - DB_PASSWORD=clinico_2026
      - DB_NAME=asilo_clinico
      - MS_SOLICITUDES_URL=http://ms-solicitudes:8081
      - MS_CATALOGO_URL=http://ms-catalogo:8084
      - MS_COBROS_URL=http://ms-cobros:8082
      - TZ=America/Guatemala
    depends_on:
      mysql:
        condition: service_healthy
      ms-solicitudes:
        condition: service_started
      ms-catalogo:
        condition: service_started
      ms-cobros:
        condition: service_started
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Remisiones y visitas medicas (esquema asilo_solicitudes). Al
  # convertir una remision le pide el cargo a ms-cobros; si cobros no
  # responde, la visita se guarda igual (RNF-12, cliente_cobros.py).
  # Especialidad, medico y enfermero los comprueba con ms-catalogo.
  # -------------------------------------------------------------------
  ms-solicitudes:
    build: ./ms-solicitudes
    container_name: asilo-ms-solicitudes
    # Sin "ports" a proposito (RNF-03).
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=u_solicitudes
      - DB_PASSWORD=solicitudes_2026
      - DB_NAME=asilo_solicitudes
      - MS_COBROS_URL=http://ms-cobros:8082
      - MS_CATALOGO_URL=http://ms-catalogo:8084
      # Servidor de correo del aviso al familiar (RF-44).
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_REMITENTE=notificaciones@asilocabezadealgodon.org
      - TZ=America/Guatemala
    depends_on:
      mysql:
        condition: service_healthy
      ms-cobros:
        condition: service_started
      ms-catalogo:
        condition: service_started
      mailpit:
        # Solo espera a que exista: si Mailpit se cae, la remision se
        # registra igual (notificaciones.py).
        condition: service_started
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Registro de internos (esquema asilo_pacientes). Entre contenedores se
  # usa el puerto interno 3306; el 3307 es solo la puerta hacia el equipo.
  # -------------------------------------------------------------------
  ms-pacientes:
    build: ./ms-pacientes
    container_name: asilo-ms-pacientes
    # Sin "ports" a proposito (RNF-03).
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=u_pacientes
      - DB_PASSWORD=pacientes_2026
      - DB_NAME=asilo_pacientes
      - TZ=America/Guatemala
    depends_on:
      mysql:
        # Espera al healthcheck de MySQL; init_db() reintenta igual.
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Gateway: la unica entrada del sistema (http://localhost:8080).
  # Autentica, revisa el rol y reenvia por la red interna.
  #
  # app-base se monta como volumen y no se copia a la imagen: un cambio
  # en las pantallas se ve al refrescar, sin reconstruir el contenedor.
  # -------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: asilo-gateway
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=u_gateway
      - DB_PASSWORD=gateway_2026
      - DB_NAME=asilo_gateway
      - MS_PACIENTES_URL=http://ms-pacientes:8083
      - MS_SOLICITUDES_URL=http://ms-solicitudes:8081
      - MS_COBROS_URL=http://ms-cobros:8082
      - MS_CATALOGO_URL=http://ms-catalogo:8084
      - MS_CLINICO_URL=http://ms-clinico:8085
      - TZ=America/Guatemala
    volumes:
      - ./app-base:/code/publico:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped


volumes:
  # Aqui viven todos los esquemas de MySQL. "docker compose down -v"
  # lo borra.
  mysql-datos:
